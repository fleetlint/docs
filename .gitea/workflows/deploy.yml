# Builds the complete site (Hugo, the fleet report as the demo, the Pagefind search
# index, every released version of the docs) and deploys it to fleetlint.org through
# the shared deploy workflow, which only receives the built site as an artifact.
# The latest release (the newest versions/vX.Y/) is the root, earlier ones are under /vX.Y/; next is not deployed.
# Gitea reads .gitea/workflows/ instead of .github/workflows/ when it exists.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # nightly: refreshes the demo report
  workflow_dispatch:

# Cancel superseded PR builds; don't cancel main (avoid half-deploys)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the history
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        # installs the versions in mise.toml: hugo, node, python, go, gitleaks
      - name: fleetlint at the version the pages come from (FLEETLINT_VERSION in the Makefile)
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check, then build the site
        # nothing is deployed unless `make check` passes; it ends with the production build in public/
        run: make check
      - name: Fleet report over the fleetlint repositories (the demo)
        run: make demo
      - name: Search index
        # one index over every version; the search page filters it to the version being read
        run: make search-index
      - name: Upload built site
        # NOT actions/upload-artifact: the official action detects Gitea as GHES and aborts
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: site
          path: public/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: self:johnny/build/.gitea/workflows/deploy-static-page.yaml@v11
    with:
      artifact-name: site
    # all five must exist as real repo secrets: Gitea does not deliver
    # literal values written here to the called workflow
    secrets:
      SSH_SERVER: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
