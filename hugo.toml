baseURL = "https://fleetlint.org/"
title = "fleetlint"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Policy for a fleet of repositories: checks how a repository is set up and how to close each gap."
  source = "https://github.com/fleetlint/docs"

[markup.highlight]
  noClasses = false   # Chroma writes classes; assets/style.css colours them from the theme's tokens, light and dark

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.goldmark.parser]
