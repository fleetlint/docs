baseURL = "https://fleetlint.org/"
title = "fleetlint"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Policy for a fleet of repositories: checks how a repository is set up and how to close each gap."
  source = "https://github.com/fleetlint/docs"

[markup.highlight]
  codeFences = false   # plain code blocks: no highlighter theme to keep in step with the color scheme

[markup.goldmark.parser]
  autoHeadingIDType = "github"

