# The demo at fleetlint.org/demo/report/: fleetlint's fleet report over its own repositories,
# rebuilt with every site build and nightly (see .gitea/workflows/deploy.yml).
version: 1
cache: .fleet-cache
repos:
  - url: https://github.com/fleetlint/fleetlint.git
    team: core
  - url: https://github.com/fleetlint/catalog.git
    team: core
  - url: https://github.com/fleetlint/docs.git
    team: docs
