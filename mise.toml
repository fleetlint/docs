# The toolchain that builds and checks the site. One place for the versions:
# `mise install` locally, jdx/mise-action in the workflows.
[tools]
hugo = "0.170.1"
node = "26.13.1"      # for the Pagefind search index (make search)
python = "3.15.2"     # for the checks in scripts/
go = "1.27.4"         # to install fleetlint (make tools)
gitleaks = "8.30.1"
