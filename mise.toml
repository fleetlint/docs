# The toolchain that builds and checks the site. One place for the versions:
# `mise install` locally, jdx/mise-action in the workflows.
[tools]
hugo = "0.168.0"
node = "24.22.0"      # for the Pagefind search index (make search)
python = "3.15.0"     # for scripts/check-links.py
go = "1.27.3"         # to install fleetlint (make tools)
gitleaks = "8.30.1"
