# Generated by scripts/versions.py from the directories in versions/; do not edit.
defaultContentVersion = "v0.8"   # the latest release, at the site root
defaultContentVersionInSubdir = false

[versions.next]   # content/: the coming release, not deployed (config/production)
  weight = 1
[versions."v0.8"]
  weight = 2
[versions."v0.7"]
  weight = 3
[versions."v0.6"]
  weight = 4
[versions."v0.5"]
  weight = 5
[versions."v0.4"]
  weight = 6
[versions."v0.3"]
  weight = 7

[[module.mounts]]
  source = "content"
  target = "content"
  [module.mounts.sites.matrix]
    versions = ["next"]

[[module.mounts]]
  source = "versions/v0.8"
  target = "content"
