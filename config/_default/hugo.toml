# Generated by scripts/versions.py from the directories in versions/; do not edit.
defaultContentVersion = "v0.4"   # the latest release, at the site root
defaultContentVersionInSubdir = false

[versions.next]   # content/: the coming release, not deployed (config/production)
  weight = 1
[versions."v0.4"]
  weight = 2
[versions."v0.3"]
  weight = 3

[[module.mounts]]
  source = "content"
  target = "content"
  [module.mounts.sites.matrix]
    versions = ["next"]

[[module.mounts]]
  source = "versions/v0.4"
  target = "content"
  [module.mounts.sites.matrix]
    versions = ["v0.4"]

[[module.mounts]]
  source = "versions/v0.3"
  target = "content"
  [module.mounts.sites.matrix]
    versions = ["v0.3"]
