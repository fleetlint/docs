# Builds the complete site (Hugo, the fleet report over the fleetlint repositories
# as the demo, the Pagefind search index) and keeps it as the `site` artifact, which
# the fleetlint.org deployment picks up. On every push to main, nightly for the demo,
# and on demand.
name: site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # installs the versions in mise.toml: hugo, node, python, go, gitleaks
      - name: Build the site
        run: make build
      - name: Fleet report over the fleetlint repositories (the demo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read access to this repository; the others are public
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          make tools demo
      - name: Search index
        run: make search-index
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
          if-no-files-found: error
          retention-days: 14
