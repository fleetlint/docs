# One file for GitHub and Gitea:
# Gitea Actions reads .github/workflows/ too, and both forges set github.server_url.
# Actions are pinned to commit SHAs; `pinact run -u` updates them
# (Renovate keeps the pins current via renovate.json).
name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches new vulnerabilities in unchanged code

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # diff-cover and gitleaks need history
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.166.0"
          extended: true
      - name: Shared tools (gitleaks, syft, diff-cover)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          pipx install diff-cover || pip install --user diff-cover
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: fleetlint (the check target runs it; pin the version you use)
        run: |
          go install github.com/fleetlint/fleetlint/cmd/fleetlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
