# One file for GitHub and Gitea:
# Gitea Actions reads .github/workflows/ too, and both forges set github.server_url.
# Actions are pinned to commit SHAs; `pinact run -u` updates them
# (Renovate keeps the pins current via renovate.json).
name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches new vulnerabilities in unchanged code

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # diff-cover and gitleaks need history
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        # installs the versions in mise.toml: hugo, node, python, go, gitleaks
      - name: fleetlint at the version the pages come from (FLEETLINT_VERSION in the Makefile)
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
