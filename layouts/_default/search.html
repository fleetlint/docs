{{ define "head" }}<link rel="stylesheet" href="/pagefind/pagefind-ui.css">{{ end }}
{{ define "main" }}
<article data-pagefind-ignore>
{{ .Content }}
<div id="search"></div>
<noscript><p>Search needs JavaScript. Every other page works without it; the <a href="{{ partial "url.html" "/rule-catalog" }}">rule catalog</a> lists all rules on one page.</p></noscript>
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  // one index for the whole site (pagefind runs over public/); results stay in the version being read
  if (window.PagefindUI) { var ui = new PagefindUI({ element: "#search", showSubResults: true, autofocus: true });
    ui.triggerFilters({ version: [{{ site.Version.Name }}] });
    var q = new URLSearchParams(location.search).get("q");   // from the header's search form without JavaScript
    if (q) ui.triggerSearch(q); }
  else { document.getElementById("search").textContent = "The search index is built when the site is deployed; it is not part of a local preview."; }
</script>
</article>
{{ end }}
